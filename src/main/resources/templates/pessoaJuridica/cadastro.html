<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">
<head th:replace="~{fragments/head :: head(~{}, ~{::title})}">
    <title>Meus Dados</title>
</head>
<body>
<main class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4">Meus Dados</h3>

            <div class="row mb-2">
                <div class="col-md-6"><strong>Nome:</strong> <span th:text="${pessoaFisica.nome}"></span></div>
                <div class="col-md-6"><strong>CPF:</strong> <span th:text="${pessoaFisica.cpf}"></span></div>
            </div>

            <div class="row mb-2">
                <div class="col-md-6"><strong>Telefone:</strong> <span th:text="${pessoaFisica.telefone}"></span></div>
                <div class="col-md-6"><strong>Email:</strong> <span th:text="${pessoaFisica.email}"></span></div>
            </div>

            <hr>

            <h5>Dados de Acesso</h5>

            <div class="row mb-2">
                <div class="col-md-6"><strong>Login:</strong>
                    <span th:text="${pessoaFisica.usuario.username}"></span>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <a th:href="@{/pessoaFisica/meuCadastro}" class="btn btn-outline-dark">Editar</a>
                <a th:href="@{/venda/view}" class="btn btn-outline-secondary">Voltar</a>
            </div>
        </div>
    </div>

</main>
</body>
</html>
